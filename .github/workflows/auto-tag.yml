name: Auto tag Windows release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'desktop.py'
      - 'packaging/**'
      - 'requirements.txt'
      - 'requirements-desktop.txt'
      - '.github/workflows/**'
      - 'update-manifest.example.json'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read application version
        id: version
        shell: bash
        run: |
          version=$(python - <<'PY'
          import re
          text=open('desktop.py',encoding='utf-8').read()
          m=re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not m:
              raise SystemExit('APP_VERSION non trovato in desktop.py')
          print(m.group(1))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Create release tag when missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
          git push origin "$tag"
